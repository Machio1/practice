# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
#  schedule:
#    - cron: '0 0 * * *'
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
permissions:
  contents: write

jobs:
  build-and-test:
    if: github.ref == 'refs/heads/master'
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: maven:3.9-eclipse-temurin-21
#      image: Dockerfile
#      options: --user root

    steps:
      - name: Branch deploy comment
        uses: actions/checkout@v7
      - run: echo "Deploying to branch ${{ github.ref_name }}"

      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: file
          path: file.txt
      - run: echo "This is a test file." > file.txt

      - name: Custom env
        run: echo "Custom environment variable is $CUSTOM_ENV_VAR"
        env:
          CUSTOM_ENV_VAR: "my-variable"

      - name: setting env var
        id: step_one
        run: |
          echo "action_state=success" >> $GITHUB_ENV

      - name: use env var
        id: step_two
        run: echo "The action state is $action_state"

      - name: Check OS
        if: runner.os == 'Linux'
        run: echo "Running on $RUNNER_OS"

      - uses: actions/checkout@v7
      - name: Build with Maven
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        name: Upload test reports
        with:
          name: test-reports
          path: target/surefire-reports/

        #Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: advanced-security/maven-dependency-submission-action@893a1d8754524d36719ec3502a3d3da6cc52a0f6
        with:
          ignore-maven-wrapper: true

  download-file:
    name: Download file
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: file
      - run: cat file.txt